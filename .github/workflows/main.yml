name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Avisar sobre arquivos de versoes antigas (ignorados pelo build)
        run: |
          for f in src/main/java/dev/rocketatmosphere/raptor src/main/java/dev/rocketatmosphere/client/AirDensity.java; do
            if [ -e "$f" ]; then echo "::warning::Arquivo/pasta antigo ignorado pelo build: $f (pode apagar do repositorio)"; fi
          done
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Conferir que os stubs NAO foram empacotados
        run: |
          if unzip -l build/libs/*.jar | grep -E "dev/(propulsionteam|ryanhcode)/"; then
            echo "ERRO: stubs dentro do jar"; exit 1
          fi
      - name: Conferir que nao ha classes antigas nem registro de cliente duplicado no jar
        run: |
          if unzip -l build/libs/*.jar | grep -E "rocketatmosphere/raptor/"; then
            echo "ERRO: classes antigas (raptor) dentro do jar"; exit 1
          fi
          n=$(unzip -l build/libs/*.jar | grep -c -E "rocketatmosphere/engine/RocketClient\.class")
          if [ "$n" != "1" ]; then echo "ERRO: esperado 1 RocketClient, achou $n"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: create-rocket-atmosphere-jar
          path: build/libs/*.jar
          
